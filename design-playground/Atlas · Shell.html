<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas · Shell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#121412;--s:#1b1e1b;--s2:#272b27;--ln:#2e332e;--tx:#ecefe6;--mu:#8d968a;--acc:#d4f25a;--accd:#d4f25a24;--fl:#ffb347;--sw:252px;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:left}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{flex:none}
/* topo mobile */
.tb{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--bg) 70%,#12141200)}
.tb h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;flex:1;display:flex;align-items:center;gap:8px;min-width:0}.tb h1 svg{color:var(--acc)}

.lv{display:flex;align-items:center;gap:7px;background:var(--s);border-radius:20px;padding:5px 10px 5px 6px}

.xb{width:54px;height:6px;border-radius:4px;background:var(--s2);overflow:hidden}.xb i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px;transition:width .7s cubic-bezier(.2,.9,.2,1)}
.xb.fl i{animation:fl .8s}@keyframes fl{50%{filter:brightness(1.8);box-shadow:0 0 12px var(--acc)}}

main{padding:64px 12px calc(110px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto;padding-top:calc(64px + env(safe-area-inset-top,0px))}
.ph{display:flex;gap:14px;align-items:center;padding:8px 4px 16px}.ph svg{color:var(--acc)}.ph h2{margin:0;font-size:28px;letter-spacing:-.03em}.ph small{color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sk{border-radius:10px;min-height:110px;background:linear-gradient(100deg,var(--s) 30%,#222622 50%,var(--s) 70%);background-size:300% 100%;animation:sh 2.4s infinite}.sk.w{grid-column:span 2;min-height:150px}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
#pg.inr{animation:ir .38s cubic-bezier(.2,.9,.2,1)}#pg.inl{animation:il .38s cubic-bezier(.2,.9,.2,1)}
@keyframes ir{from{opacity:0;transform:translateX(26px)}}@keyframes il{from{opacity:0;transform:translateX(-26px)}}

#bn .bg{position:absolute;inset:0;background:#1d211dee;border-radius:24px;box-shadow:0 10px 30px #000a;backdrop-filter:blur(14px);-webkit-mask:radial-gradient(circle 40px at 50% 9px,#0000 39px,#000 40px);mask:radial-gradient(circle 40px at 50% 9px,#0000 39px,#000 40px)}
#bn .ind{position:absolute;bottom:5px;left:0;width:26px;height:4px;border-radius:4px;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
#bn>button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11px;font-weight:600;transition:color .2s}
#bn>button svg{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
#bn>button.on{color:var(--tx)}#bn>button.on svg{color:var(--acc);transform:translateY(-2px) scale(1.14)}

#bn .sp{pointer-events:none}
#bn #plus{position:absolute;left:50%;top:-24px;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:var(--acc);color:#141a0a;display:grid;place-items:center;box-shadow:0 8px 24px #000a,0 0 0 0 var(--accd);z-index:3;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}

#ov{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:22}#ov.on{opacity:1;pointer-events:auto}

.qi:nth-child(1){--x:-94px;--y:-96px;--i:0}.qi:nth-child(2){--x:0px;--y:-146px;--i:1}.qi:nth-child(3){--x:94px;--y:-96px;--i:2}

/* sidebar desktop */
#sb{display:none}
@media(min-width:860px){

 #qm{bottom:auto;width:auto;height:auto;background:var(--s2);border-radius:16px;padding:6px;min-width:200px;box-shadow:0 14px 40px #000b}#qm.on .qi{transform:none}.qi:hover{background:var(--s)}.qc{width:36px;height:36px;box-shadow:none;background:var(--bg)}
}
/* sheet */
#sh2{position:fixed;left:50%;bottom:0;width:min(460px,100%);transform:translate(-50%,105%);background:var(--s);border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transition:transform .35s cubic-bezier(.2,.9,.2,1);z-index:40;max-height:90%;overflow:auto}#sh2.on{transform:translate(-50%,0)}
@media(min-width:860px){#sh2{bottom:50%;border-radius:18px;transform:translate(-50%,50%) scale(.9);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s}#sh2.on{transform:translate(-50%,50%);opacity:1;pointer-events:auto}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 12px}#sh2 h3{margin:4px 0 8px;font-size:20px}
.tg{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 2px;border-top:1px solid var(--ln);font-weight:600}.tg:first-of-type{border-top:0}.tg small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.swt{width:48px;height:28px;border-radius:14px;background:var(--s2);position:relative;transition:background .25s;flex:none}.swt::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--tx);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.swt.on{background:var(--acc)}.swt.on::after{transform:translateX(20px);background:#141a0a}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px;margin:6px 0 4px}.seg button{flex:1;display:flex;gap:7px;align-items:center;justify-content:center;padding:10px;border-radius:8px;font-weight:600;color:var(--mu);transition:background .2s,color .2s}.seg button.on{background:var(--tx);color:#141a0a}
.lb{font-size:12px;color:var(--mu);margin:10px 0 2px}
.p{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:90}
#cv{position:fixed;inset:0;pointer-events:none;z-index:95}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--tx);color:#141a0a;padding:11px 16px;border-radius:12px;font-weight:700;transition:transform .4s cubic-bezier(.3,1.5,.5,1);z-index:99;max-width:92%}#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.rm *{animation:none!important;transition:none!important}
</style></head><body>
<header class="tb"><h1 id="tt"></h1><span class="fire"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#ffb347" d="M12 2c.8 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.6 1.6-3.8 2.6-5.6.9 1.7 2.1 1.9 2.1.3 0-1.8.1-3.6.8-5.7z"/></svg><span class="stk"></span></span><div class="lv"><b class="lvn"></b><div class="xb"><i class="xf"></i></div></div></header>

 <div class="pf"><div class="ring"><svg width="44" height="44"><circle cx="22" cy="22" r="18" fill="none" stroke="#272b27" stroke-width="4"/><circle class="v" cx="22" cy="22" r="18" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113"/></svg><b class="lvn2"></b></div><div class="lab"><b>Nível <span class="lvn3"></span></b><div class="xb"><i class="xf"></i></div><div class="r2"><small class="xt"></small><span class="fire" style="font-size:13px"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#ffb347" d="M12 2c.8 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.6 1.6-3.8 2.6-5.6.9 1.7 2.1 1.9 2.1.3 0-1.8.1-3.6.8-5.7z"/></svg><span class="stk"></span></span></div></div></div>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',chk:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',clk:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',wal:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>',not:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>',gra:'<circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8l8-1M7.5 9l3.5 7M16.5 8l-3.5 8"/>',fbk:'<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/>',mor:'<circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/>',cfg:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',cat:'<path d="M4 9l2-5 4 3h4l4-3 2 5v6a6 6 0 0 1-6 5h-4a6 6 0 0 1-6-5z"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/>',gho:'<path d="M12 2l8 8-8 8-8-8z"/><circle cx="12" cy="10" r="2.4"/><path d="M8 21h8"/>'};
const ic=(k,s,w)=>'<svg viewBox="0 0 24 24" width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';
const M=[['hoje','Home','sun'],['habitos','Hábitos','chk'],['tempo','Tempo','clk'],['financas','Finanças','wal'],['notas','Notas','not'],['grafo','Grafo','gra'],['feedback','Feedback','fbk']],PRI=['hoje','habitos','tempo'];
const Q=[['hab','Hábito','chk'],['lan','Lançamento','wal'],['not','Nota','not']];
const RM0=matchMedia('(prefers-reduced-motion:reduce)').matches;
const init=()=>({cur:'hoje',xp:140,lf:62,streak:6,snd:1,vib:1,vivid:1,mascot:'cat',col:0,rm:0});
let S;try{S=JSON.parse(localStorage.getItem('atlas-shell')||'null')}catch(e){}S=Object.assign(init(),S||{});
const save=()=>{try{localStorage.setItem('atlas-shell',JSON.stringify(S))}catch(e){}};
let ac;function snd(f,d,t,v,f2){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+(d||.1));g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+(d||.1));o.connect(g);g.connect(ac.destination);o.start();o.stop(n+(d||.1))}catch(e){}}
const vib=p=>{if(S.vib)try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const RM=()=>RM0||S.rm;
const ctr=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function fx(x,y,n){if(RM())return;for(let i=0;i<n;i++){const p=document.createElement('i');p.className='p';p.style.cssText='left:'+x+'px;top:'+y+'px;background:var(--acc)';document.body.appendChild(p);const a=Math.random()*6.28,d=22+Math.random()*44;p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(0)',opacity:0}],{duration:560,easing:'ease-out'}).onfinish=()=>p.remove()}}
function confetti(n){if(RM())return;const c=$('#cv'),x=c.getContext('2d'),cols=['#d4f25a','#ffb347','#9cc8ff','#f1a5c5'];c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:n},(_,i)=>({x:innerWidth/2,y:innerHeight*.5,vx:(Math.random()-.5)*14,vy:-8-Math.random()*9,r:Math.random()*6,s:5+Math.random()*6,c:cols[i%4]}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);x.restore()});if(++t<100)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
/* montagem */
