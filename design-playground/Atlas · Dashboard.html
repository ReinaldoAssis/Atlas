<style>

.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kp button{background:var(--s2);border-radius:12px;padding:14px 0;font-size:22px;font-weight:600;text-align:center}.kp button:active{transform:scale(.93)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:8px;background:linear-gradient(to right,var(--acc) var(--f,0%),var(--s2) 0);outline:0;margin:8px 0}

.p{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:50}.fl{position:fixed;font-weight:800;font-size:18px;pointer-events:none;z-index:50}

<script>
(function(){

function confetti(n){if(RM)return;const c=$('#cv'),x=c.getContext('2d'),cols=['#d4f25a','#ffb347','#9cc8ff','#f1a5c5'];c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:n},(_,i)=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*15,vy:-8-Math.random()*10,r:Math.random()*6,s:5+Math.random()*6,c:cols[i%4]}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);x.restore()});if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

$$('.cat').forEach(c=>c.innerHTML=CAT);

addEventListener('pointermove',e=>{$$('.pp').forEach(p=>{const r=p.getBoundingClientRect(),dx=Math.max(-1,Math.min(1,(e.clientX-r.left)/200)),dy=Math.max(-1,Math.min(1,(e.clientY-r.top)/200));p.style.transform='translate('+dx*3.5+'px,'+dy*2+'px)'})});
/* render */
function theme(){const f=S.lf/100;document.documentElement.style.setProperty('--acc','hsl(72 '+(12+68*f)+'% '+(34+32*f)+'%)');document.documentElement.style.setProperty('--accd','hsl(72 '+(12+68*f)+'% '+(34+32*f)+'% / .14)')}
function render(){theme();const n=nd(),g=Math.min(n,3)/3;
 $('#dt').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('#sk').textContent=S.streak;
 $('#lfn').textContent=Math.round(S.lf)+'%';$('#lfb').style.width=S.lf+'%';$('#lfs').textContent=S.lf>=70?'Viva':S.lf>=30?'Estável':'Apagando';
 $('#rg').style.strokeDashoffset=245*(1-g);$('#rc').textContent=Math.min(n,3)+'/3';
 const B=[];let b=0;for(let i=0;i<14;i++){S.tx.forEach(t=>{if(13-t.o===i)b+=(t.t==='in'?1:-1)*t.v});B.push(b)}
 const mn=Math.min(...B),mx=Math.max(...B),sy=v=>84-(v-mn)/(mx-mn||1)*70,d='M'+B.map((v,i)=>(i/13*300).toFixed(1)+','+sy(v).toFixed(1)).join(' L');
 $('#bal').textContent=brl(b);$('#ln').innerHTML='<svg class="ln" viewBox="0 0 300 90"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".3"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs><path d="'+d+' L300,90 L0,90Z" fill="url(#gA)"/><path class="dr" pathLength="1" d="'+d+'"/></svg><i class="pt" style="left:100%;top:'+sy(B[13])/90*100+'%"></i>';
 const dt=S.tm.map(x=>TC.reduce((a,c)=>a+(x[c[0]]||0),0)),M=Math.max(8,...dt);let s='<svg viewBox="0 0 300 130" style="width:100%;display:block">';
 S.tm.forEach((x,i)=>{let y=108;const bx=i*300/7+(300/7-26)/2;TC.forEach(c=>{const h=(x[c[0]]||0)/M*100;if(h>0){y-=h;s+='<rect class="bg" x="'+bx+'" y="'+y+'" width="26" height="'+h+'" rx="4" fill="'+c[1]+'" style="animation-delay:'+i*70+'ms"/>'}});s+='<text x="'+(bx+13)+'" y="126" text-anchor="middle" font-size="11" fill="'+(i===TM?'var(--acc)':'#8d968a')+'">'+LET[i]+'</text>'});$('#bars').innerHTML=s+'</svg>';
 const o={};S.tx.filter(t=>t.t==='out').forEach(t=>o[t.cat]=(o[t.cat]||0)+t.v);const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),T=e.reduce((a,x)=>a+x[1],0),C=2*Math.PI*38;let off=0,ds='<svg class="dn" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#272b27" stroke-width="14"/>';
 e.forEach((x,i)=>{const l=x[1]/T*C;ds+='<circle class="sg" cx="50" cy="50" r="38" fill="none" stroke="'+CC[x[0]]+'" stroke-width="14" stroke-dasharray="'+Math.max(0,l-2)+' '+C+'" stroke-dashoffset="'+-off+'" style="animation-delay:'+i*110+'ms"/>';off+=l});
 $('#dn').innerHTML=ds+'</svg><div class="rc" style="font-size:13px;line-height:1.1;text-align:center">'+brl(T).replace(',00','')+'</div>';
 $('#lg').innerHTML=e.map(x=>'<div class="lg"><span><i style="background:'+CC[x[0]]+'"></i>'+x[0]+'</span><small>'+Math.round(x[1]/T*100)+'%</small></div>').join('');
 const hv=S.hm.slice(0,27).concat([n]);$('#hm').innerHTML=hv.map((v,i)=>'<i class="'+(i===27?'td':'')+'" style="--v:'+v+';animation-delay:'+i*12+'ms"></i>').join('');
 const gs=[['Ler 30h no mês',(840+val(H[1]))/1800],['Academia 12x no mês',(6+val(H[3]))/12],['Meta de economia',saved()/2000]];
 $('#gs').innerHTML=gs.map(x=>{const p=Math.max(0,Math.min(100,Math.round(x[1]*100)));return '<div class="gl"><div><span>'+x[0]+'</span><small>'+p+'%</small></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join('')}
function bump(n){S.lf=Math.min(100,S.lf+n);save();render()}
/* sheets */
const sh=$('#sh');function openSh(h){sh.innerHTML=h;$('#ov').classList.add('on');sh.classList.add('on')}
function closeAll(){$('#ov').classList.remove('on');sh.classList.remove('on');$('#dr').classList.remove('on');mood('sleep')}
$('#ov').addEventListener('click',closeAll);
const fab=$('#fab'),fm=$('#fm');
fab.addEventListener('click',()=>{const on=fab.classList.toggle('on');fm.classList.toggle('on',on);snd(on?480:380,.08);vib(6)});
document.addEventListener('click',e=>{if(!e.target.closest('#fab,#fm')){fab.classList.remove('on');fm.classList.remove('on')}});
/* lançamento rápido */
let m={t:'out',cat:'Alimentação',c:0};
function lanc(){const cs=m.t==='out'?OUT:INN;if(!cs.includes(m.cat))m.cat=cs[0];
 openSh('<div class="grip"></div><div class="seg"><button data-t="out" class="'+(m.t==='out'?'on':'')+'">Despesa</button><button data-t="in" class="'+(m.t==='in'?'on':'')+'">Receita</button></div><div id="amt" class="'+m.t+'">'+brl(m.c/100)+'</div><div class="chips">'+cs.map(c=>'<button class="cp'+(c===m.cat?' on':'')+'" data-k="'+c+'" style="--cc:'+CC[c]+'"><i></i>'+c+'</button>').join('')+'</div><div class="kp">'+['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>'<button data-key="'+k+'">'+k+'</button>').join('')+'</div><div class="btns"><button class="btn p" id="go">Lançar</button></div>')}
$('#ff').addEventListener('click',()=>{m.c=0;fab.classList.remove('on');fm.classList.remove('on');lanc();snd(380,.1)});
/* hábito rápido */
let hs=null,hv=0;
function hq(){const h=hs;openSh('<div class="grip"></div><div class="chips">'+H.map(x=>'<button class="cp'+(x===h?' on':'')+'" data-h="'+x.id+'" style="--cc:var(--acc)"><i></i>'+x.n+(dn(x)?' ✓':'')+'</button>').join('')+'</div>'+(h.t==='b'?'<div class="btns"><button class="btn p" id="hb">'+(val(h)?'Desmarcar':'Marcar como feito')+'</button></div>':'<div id="hv"></div><input type="range" id="rn" aria-label="Valor" min="0" max="'+h.max+'" step="'+h.step+'"><div class="chips" style="justify-content:center;margin-top:10px">'+h.chips.map(c=>'<button class="cp" data-c="'+c+'">'+(h.add?'+'+c+' ml':h.t==='d'?hm_(c):c+'x')+'</button>').join('')+'</div><div class="btns"><button class="btn p" id="hs">Registrar</button></div>'));
 if(h.t!=='b'){hv=val(h);$('#rn').value=hv;hu()}}
function hu(){const v=+$('#rn').value;$('#hv').textContent=fv(hs,v);$('#hv').classList.toggle('hit',v>=hs.goal);$('#rn').style.setProperty('--f',v/hs.max*100+'%')}
$('#fh').addEventListener('click',()=>{hs=H.find(x=>!dn(x))||H[0];fab.classList.remove('on');fm.classList.remove('on');hq();snd(380,.1)});
function setH(h,v){const was=dn(h);S.v[h.id]=v;closeAll();render();if(!was&&dn(h)){const[x,y]=ctr(fab);fx(x,y-20,18);flo(x,y-60,'+6','var(--acc)');snd(660,.2,'triangle',.07);setTimeout(()=>snd(990,.2,'triangle',.05),90);vib([14,40,14]);bump(6);if(nd()===3)setTimeout(()=>{confetti(80);toast('Meta do dia concluída')},400)}else save()}
function addTx(){if(!m.c)return;const v=m.c/100,t=m.t,c=m.cat;S.tx.push({o:0,t,v,cat:c});closeAll();const[x,y]=ctr(fab);
 if(t==='in'){fx(x,y-20,18,'#ffd45a');flo(x,y-60,'+'+brl(v),'#ffd45a');snd(1175,.12,'triangle',.06);setTimeout(()=>snd(1568,.2,'triangle',.06),90);vib([10,30,10])}else{fx(x,y-20,9,'#8d968a');snd(200,.16,'sine',.07);vib(14)}bump(4)}
sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){m.t=b.dataset.t;lanc();snd(420,.06)}else if(b.dataset.k){m.cat=b.dataset.k;lanc();snd(520,.06);vib(5)}
 else if(b.dataset.key){const k=b.dataset.key;m.c=k==='⌫'?Math.floor(m.c/10):Math.min(99999999,m.c*(k==='00'?100:10)+(k==='00'?0:+k));$('#amt').textContent=brl(m.c/100);snd(k==='⌫'?220:300+(+k||0)*34,.05,'sine',.04);vib(4)}
 else if(b.id==='go')addTx();
 else if(b.dataset.h){hs=H.find(x=>x.id===b.dataset.h);hq();snd(480,.06)}
 else if(b.dataset.c){const c=+b.dataset.c;$('#rn').value=hs.add?Math.min(hs.max,+$('#rn').value+c):c;$('#rn').dispatchEvent(new Event('input'));snd(520,.08)}
 else if(b.id==='hb')setH(hs,val(hs)?0:1);else if(b.id==='hs')setH(hs,+$('#rn').value)});
sh.addEventListener('input',e=>{if(e.target.id==='rn'){const v=+e.target.value;if(v!==hv){snd(240+v/hs.max*520,.04,'sine',.025);vib(3);if(hv<hs.goal&&v>=hs.goal){fx(...ctr($('#hv')),14);snd(880,.2,'triangle',.06)}hv=v}hu()}});
/* IA gato */
const SG=[{b:'Você reservou 3h de leitura e registrou 1h30 esta semana.',e:'Agenda e registros de hábito',h:'Os blocos de 2h parecem longos demais.',x:'Sessões de 25 min por uma semana',a:[{k:'tm',l:'Alocar 3 blocos de leitura',tm:{lei:1.5}},{k:'ok',l:'Criar rotina "Leitura 25 min"'},{k:'lock',l:'Editar nota "Plano de leitura"'}]},
 {b:'Lazer já está perto do limite do mês.',e:'Lançamentos de Lazer e orçamento',h:'Falta um momento fixo para revisar gastos.',x:'Um bloco semanal de revisão financeira',a:[{k:'tm',l:'Alocar 1 bloco de revisão financeira',tm:{adm:.5}},{k:'lock',l:'Lançar transação em Finanças'}]}];
let si=0,ap=[];
function sug(){const s=SG[si];$('#bub').textContent=s.b;$('#dc').innerHTML='<div class="kv"><small>Evidência</small>'+s.e+'</div><div class="kv"><small>Hipótese</small>'+s.h+'</div><div class="kv"><small>Experimento</small>'+s.x+'</div>'+s.a.map((a,j)=>'<button class="act'+(a.k==='lock'?' lock':' on')+'" data-a="'+j+'"><span class="bx">✓</span><span>'+a.l+(a.k==='lock'?'<small>A IA só lê este módulo</small>':'')+'</span></button>').join('')+'<div class="btns"><button class="btn" id="ot">Outra</button><button class="btn p" id="ok">Aplicar</button></div>'}
function think(fn){mood('think');$('#dc').innerHTML='';$('#bub').textContent='…';setTimeout(()=>{mood('awake');fn()},900)}
$('#summon').addEventListener('click',()=>{const t=$('#summon');t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse');mood('awake');meow();vib([30,30,30,30,60]);fx(...ctr(t),14);setTimeout(()=>{$('#ov').classList.add('on');$('#dr').classList.add('on');think(sug)},420)});
$('#dr').addEventListener('click',e=>{const a=e.target.closest('.act');if(a&&!a.classList.contains('lock')){a.classList.toggle('on');snd(500,.05);return}
 if(e.target.id==='ot'){si=(si+1)%SG.length;snd(420,.06);think(sug)}
 if(e.target.id==='ok'){let n=0;$$('#dc .act.on').forEach(el=>{const x=SG[si].a[+el.dataset.a];if(x.tm){const d=S.tm[TM];Object.keys(x.tm).forEach(k=>d[k]=(d[k]||0)+x.tm[k])}n++});save();mood('happy');meow();confetti(60);vib([12,30,12,30,60]);$('#bub').textContent='Pronto. '+n+' alterações feitas.';$('#dc').innerHTML='';bump(6);setTimeout(()=>$('#dr').classList.contains('on')&&closeAll(),1700)}});
function chat(){const v=$('#inp').value.trim();if(!v)return;$('#inp').value='';const u=document.createElement('div');u.className='m u';u.textContent=v;$('#ms').appendChild(u);mood('think');setTimeout(()=>{const a=document.createElement('div');a.className='m a';a.textContent='Demonstração: aqui responde o modelo local, lendo suas notas e registros.';$('#ms').appendChild(a);mood('awake');snd(540,.08)},700)}
$('#snd').addEventListener('click',chat);$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter')chat()});
$('#mute').addEventListener('click',()=>{S.mute=S.mute?0:1;$('#mute').textContent=S.mute?'×':'♪';save()});$('#mute').textContent=S.mute?'×':'♪';
render();
})();
</script></body></html>
