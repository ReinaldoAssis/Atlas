const hl=(t,q)=>{const e=E(t);if(!q)return e;try{return e.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}catch(x){return e}};
const snip=b=>{const l=b.split('\n').find(x=>x.trim()&&!x.startsWith('#'))||'';return l.replace(/[*`>\[\]-]/g,'').replace(/^\s*\d+\.\s*/,'').trim()};
let anim=1;
function render(){const q=S.q.trim(),g=!!(q||S.tf.length),nq=nn(q);
 const tg={};S.notes.forEach(n=>n.tags.forEach(t=>tg[t]=(tg[t]||0)+1));
 $('#tgs').innerHTML=Object.entries(tg).sort((a,b)=>b[1]-a[1]).map(x=>'<button class="tg'+(S.tf.includes(x[0])?' on':'')+'" data-t="'+x[0]+'" style="--cc:'+tcol(x[0])+'"><i>#</i>'+x[0]+' <small>'+x[1]+'</small></button>').join('');
 let list=S.notes;
 if(g){list=list.filter(n=>(!S.tf.length||S.tf.every(t=>n.tags.includes(t)))&&(!q||nn(n.t).includes(nq)||nn(n.b).includes(nq)||n.tags.some(t=>nn(t).includes(nq.replace('#','')))));
  if(q)list=list.sort((a,b)=>(nn(b.t).includes(nq)?1:0)-(nn(a.t).includes(nq)?1:0))}
 else list=list.filter(n=>n.f===S.cur);
 if(!q)list=list.slice().sort((a,b)=>b.pin-a.pin||b.u-a.u);
 $('#cr').innerHTML=g?'<button data-fid="0">Notas</button>› <span style="color:var(--acc);font-weight:600">'+list.length+(list.length===1?' resultado':' resultados')+'</span>':'<button data-fid="0">Notas</button>'+path(S.cur).map(f=>'› <button data-fid="'+f.id+'" style="--cc:'+f.c+'">'+FI('mi')+E(f.n)+'</button>').join('');
 $('#fl').innerHTML=g?'':S.folders.filter(f=>f.p===S.cur).map(f=>'<button class="fo" data-fid="'+f.id+'" data-open="1" style="--cc:'+f.c+'">'+FI()+'<span><b>'+E(f.n)+'</b><small>'+cnt(f.id)+' notas</small></span></button>').join('')+'<button class="fo new" id="nf">+ Pasta</button>';
 $('#rw').innerHTML=list.length?list.map(n=>'<button class="row" data-n="'+n.id+'" style="--cc:'+fc(n.f)+'"><div class="tt">'+hl(n.t,q)+'</div><div class="sn">'+hl(snip(n.b),q)+'</div><div class="mt">'+(g&&n.f?'<span>'+E(path(n.f).map(f=>f.n).join(' › '))+'</span>':'')+n.tags.map(t=>'<span class="t" style="--cc:'+tcol(t)+'">#'+t+'</span>').join('')+'<span>'+rel(n.u)+'</span></div><span class="pin'+(n.pin?' on':'')+'" data-pin="'+n.id+'" role="button" aria-label="Fixar">'+(n.pin?'★':'☆')+'</span></button>').join(''):'<div class="empty">'+(g?'Nada encontrado':'Pasta vazia')+'</div>';
 $('#app').classList.toggle('anim',anim);anim=0;
 $('#cn').textContent=S.notes.length+' notas · '+S.folders.length+' pastas';$('#sb').classList.toggle('has',!!S.q)}
function go(f){S.cur=f;S.q='';S.tf=[];$('#q').value='';anim=1;render();window.scrollTo({top:0})}
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(e.data)snd(900+Math.random()*300,.02,'square',.012);vib(2);render()});
$('#qx').addEventListener('click',()=>{S.q='';$('#q').value='';snd(420,.05);vib(5);render();$('#q').focus()});
$('#tgs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t,i=S.tf.indexOf(t);i<0?S.tf.push(t):S.tf.splice(i,1);anim=1;snd(i<0?620:440,.06);vib(6);if(i<0){const[x,y]=ctr(b);fx(x,y,6,tcol(t))}render()});
/* clicks */
let noclk=0;
document.addEventListener('click',e=>{if(noclk)return;
 const pn=e.target.closest('[data-pin]');if(pn){e.stopPropagation();const n=nt(+pn.dataset.pin);n.pin=n.pin?0:1;save();if(n.pin){const[x,y]=ctr(pn);fx(x,y,10);snd(784,.12,'triangle',.06);vib([8,20,8])}else{snd(300,.08);vib(5)}render();return}
 const f=e.target.closest('[data-fid]');if(f&&!document.body.classList.contains('dragging')&&!e.target.closest('#sh')){snd(520,.07);vib(6);go(+f.dataset.fid);return}
 const r=e.target.closest('.row');if(r){openN(+r.dataset.n);return}
 if(e.target.closest('#nf')){newFolder();return}});
/* arrastar para mover */
let dr=null,lp=null,gh=null,tgt=null;
function startDrag(){if(!dr)return;dr.on=1;gh=document.createElement('div');gh.className='gh';gh.textContent=nt(dr.id).t;document.body.appendChild(gh);document.body.classList.add('dragging');vib(16);snd(300,.1,'triangle',.05,600);mv(dr.cx,dr.cy)}
function mv(x,y){if(!gh)return;gh.style.left=x+'px';gh.style.top=y+'px';const el=document.elementFromPoint(x,y),f=el&&el.closest('[data-fid]');if(f!==tgt){if(tgt)tgt.classList.remove('drop');tgt=f;if(f){f.classList.add('drop');snd(700,.05);vib(6)}}}
$('#rw').addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r||e.target.closest('[data-pin]'))return;dr={id:+r.dataset.n,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,on:0,m:e.pointerType==='mouse'};if(!dr.m)lp=setTimeout(startDrag,330)});
window.addEventListener('pointermove',e=>{if(!dr)return;dr.cx=e.clientX;dr.cy=e.clientY;const d=Math.hypot(e.clientX-dr.x,e.clientY-dr.y);if(!dr.on){if(dr.m&&d>8)startDrag();else if(!dr.m&&d>9){clearTimeout(lp);dr=null}}else mv(e.clientX,e.clientY)});
window.addEventListener('touchmove',e=>{if(dr&&dr.on)e.preventDefault()},{passive:false});
function endDrag(e){clearTimeout(lp);if(!dr)return;const d=dr;dr=null;if(!d.on)return;noclk=1;setTimeout(()=>noclk=0,60);document.body.classList.remove('dragging');const t=tgt;tgt=null;if(gh){gh.remove();gh=null}document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
 if(e.type==='pointerup'&&t){const n=nt(d.id),to=+t.dataset.fid;if(n.f!==to){const from=n.f;n.f=to;save();const[x,y]=ctr(t);fx(x,y,16,fc(to));snd(220,.14,'sine',.08);setTimeout(()=>snd(660,.14,'triangle',.05),80);vib([12,30,12]);anim=1;render();toast('Movida para '+(to?fo(to).n:'Notas'),()=>{n.f=from;save();render()})}}else snd(260,.1)}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
/* sheets */
const sh=$('#sh');function openSh(h){sh.innerHTML=h;$('#ov').classList.add('on');sh.classList.add('on')}
function closeSh(){$('#ov').classList.remove('on');sh.classList.remove('on')}$('#ov').addEventListener('click',closeSh);
let nf={n:'',c:COL[1]};
function newFolder(){nf={n:'',c:COL[S.folders.length%6]};snd(380,.1);openSh('<div class="grip"></div><input class="inp" id="fn" placeholder="Nome da pasta" maxlength="22" aria-label="Nome"><div class="sw">'+COL.map(c=>'<button data-col="'+c+'" class="'+(c===nf.c?'on':'')+'" style="--cc:'+c+'" aria-label="Cor"></button>').join('')+'</div><button class="btn" id="fs">Criar pasta</button>');setTimeout(()=>{try{$('#fn').focus()}catch(e){}},350)}
let pk=null;
function picker(){snd(380,.1);const row=(f,d)=>'<button class="pk" data-mv="'+f.id+'" style="--cc:'+f.c+';padding-left:'+(10+d*22)+'px">'+FI('mi')+E(f.n)+'</button>'+S.folders.filter(x=>x.p===f.id).map(x=>row(x,d+1)).join('');
 openSh('<div class="grip"></div><button class="pk" data-mv="0" style="--cc:#8d968a"><i></i>Notas (raiz)</button>'+S.folders.filter(f=>!f.p).map(f=>row(f,0)).join(''))}
sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.col){nf.c=b.dataset.col;sh.querySelectorAll('.sw button').forEach(s=>s.classList.toggle('on',s===b));snd(600,.06);vib(5)}
 else if(b.id==='fs'){const n=$('#fn').value.trim();if(!n){const i=$('#fn');i.focus();if(!RM)i.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:200});vib(20);return}S.folders.push({id:S.nid++,n,p:S.cur,c:nf.c});save();closeSh();anim=1;render();const t=document.querySelector('[data-fid="'+(S.nid-1)+'"]');if(t){const[x,y]=ctr(t);fx(x,y,16,nf.c);if(!RM)t.animate([{transform:'scale(.7)'},{transform:'scale(1.08)'},{transform:'none'}],{duration:420,easing:'cubic-bezier(.3,1.6,.5,1)'})}snd(660,.15,'triangle',.06);setTimeout(()=>snd(880,.18,'triangle',.06),90);vib([10,30,10])}
 else if(b.dataset.mv!==undefined){const n=cur,to=+b.dataset.mv,from=n.f;n.f=to;save();closeSh();$('#efc').textContent=to?fo(to).n:'Notas';snd(220,.14,'sine',.08);setTimeout(()=>snd(660,.14,'triangle',.05),80);vib([12,30,12]);toast('Movida para '+(to?fo(to).n:'Notas'),()=>{n.f=from;save();$('#efc').textContent=from?fo(from).n:'Notas';render()})}});
/* editor */
let cur=null,sv=null,pend=0;
function setMode(m,q){$('#pa').dataset.m=m;$('#sg').dataset.m=m;$('#sg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#pv').innerHTML=md(cur.b);if(!q){snd(m==='ed'?520:420,.06);vib(6)}if(m==='ed')setTimeout(()=>{try{$('#bd').focus()}catch(e){}},300)}
function openN(id,mode,nw){cur=nt(id);$('#ti').value=cur.t;$('#bd').value=cur.b;$('#efc').textContent=cur.f?fo(cur.f).n:'Notas';edUpd();$('#ed').classList.add('on');setMode(mode||'pv',1);snd(420,.14,'triangle',.05,700);vib(8);if(nw)setTimeout(()=>{try{$('#ti').select()}catch(e){}},400)}
function edUpd(){$('#ep').textContent=cur.pin?'★':'☆';$('#ep').style.color=cur.pin?'var(--acc)':'';$('#et').innerHTML=cur.tags.map(t=>'<button class="chip x" data-x="'+t+'" style="--cc:'+tcol(t)+'">#'+t+'</button>').join('')+'<input id="nt" placeholder="+ tag" aria-label="Nova tag" maxlength="20">';
 const bl=S.notes.filter(n=>n!==cur&&nn(n.b).includes('[['+nn(cur.t)+']]'));$('#bl').innerHTML=bl.length?'Referenciada por '+bl.map(n=>'<a href="#" data-l="'+E(n.t)+'" style="color:var(--acc)">'+E(n.t)+'</a>').join(', '):''}
function closeN(){if(!cur)return;cur.u=Date.now();save();$('#ed').classList.remove('on');snd(380,.1,'triangle',.04,260);vib(6);anim=0;render();cur=null}
$('#eb').addEventListener('click',closeN);
$('#efc').addEventListener('click',picker);
$('#ep').addEventListener('click',()=>{cur.pin=cur.pin?0:1;save();edUpd();if(cur.pin){fx(...ctr($('#ep')),10);snd(784,.12,'triangle',.06);vib([8,20,8])}else snd(300,.08)});
$('#edl').addEventListener('click',()=>{const n=cur,i=S.notes.indexOf(n);S.notes.splice(i,1);save();$('#ed').classList.remove('on');cur=null;snd(200,.16);vib(14);anim=0;render();toast('Nota excluída',()=>{S.notes.splice(i,0,n);save();render()})});
$('#sg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)});
function saved(){const s=$('#sv');s.textContent='Salvando…';s.classList.remove('ok');clearTimeout(sv);sv=setTimeout(()=>{s.textContent='Salvo ✓';s.classList.add('ok');cur.u=Date.now();save();if(!RM)s.animate([{transform:'scale(1.3)'},{transform:'none'}],{duration:260});snd(880,.06,'sine',.03)},800)}
$('#bd').addEventListener('input',e=>{cur.b=e.target.value;if(e.data)snd(950+Math.random()*250,.015,'square',.01);saved();if(matchMedia('(min-width:860px)').matches)$('#pv').innerHTML=md(cur.b);edUpd()});
$('#ti').addEventListener('input',e=>{cur.t=e.target.value||'Sem título';saved()});
$('#tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=$('#bd'),s=t.selectionStart,en=t.selectionEnd,tx=b.dataset.i.replace('\\n','\n'),k=tx.indexOf('|'),sel=t.value.slice(s,en);const ins=k>=0?tx.slice(0,k)+sel+tx.slice(k+1):tx;t.setRangeText(ins,s,en,'end');if(k>=0&&!sel)t.selectionStart=t.selectionEnd=s+k;t.focus();cur.b=t.value;snd(700,.04,'triangle',.04);vib(5);saved();if(matchMedia('(min-width:860px)').matches)$('#pv').innerHTML=md(cur.b)});
$('#pv').addEventListener('click',e=>{const a=e.target.closest('.wl');if(!a)return;const t=a.dataset.l;let n=byT(t);if(!n){n={id:S.nid++,t,f:cur.f,tags:[],pin:0,u:Date.now(),b:'# '+t+'\n\n'};S.notes.push(n);fx(...ctr(a),12);snd(660,.12,'triangle',.06);vib([10,30,10])}else{snd(560,.08);vib(6)}save();cur.u=Date.now();const id=n.id;$('#pa').animate([{opacity:1},{opacity:0,transform:'translateX(-16px)'}],{duration:130}).onfinish=()=>openN(id,n.b.length<20?'ed':'pv',n.b.length<20)});
$('#bl').addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();const n=byT(a.dataset.l);if(n){snd(560,.08);vib(6);openN(n.id)}});
$('#et').addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(x){cur.tags=cur.tags.filter(t=>t!==x.dataset.x);save();edUpd();snd(300,.06);vib(5)}});
$('#et').addEventListener('keydown',e=>{if(e.target.id==='nt'&&(e.key==='Enter'||e.key===',')){e.preventDefault();const t=e.target.value.trim().replace(/^#/,'').toLowerCase();if(t&&!cur.tags.includes(t)){cur.tags.push(t);save();edUpd();const c=document.querySelector('[data-x="'+t+'"]');if(c){fx(...ctr(c),8,tcol(t))}snd(700,.1,'triangle',.05);vib([8,20,8]);$('#nt').focus()}}});
$('#fab').addEventListener('click',()=>{const n={id:S.nid++,t:'Nova nota',f:S.q||S.tf.length?0:S.cur,tags:S.tf.slice(),pin:0,u:Date.now(),b:'# Nova nota\n\n'};S.notes.push(n);save();fx(...ctr($('#fab')),14);snd(520,.1,'triangle',.06);setTimeout(()=>snd(780,.14,'triangle',.06),70);vib([10,30,10]);anim=1;render();openN(n.id,'ed',1)});
$('#mute').addEventListener('click',()=>{S.mute=S.mute?0:1;$('#mute').textContent=S.mute?'×':'♪';save()});$('#mute').textContent=S.mute?'×':'♪';
document.addEventListener('mouseover',e=>{const f=e.target.closest('.fo[data-fid]');if(f&&!f.contains(e.relatedTarget))snd(640,.05,'sine',.025)});
render();
})();
