name: Android

# Release do Android por tag semver. Assina o AAB com a upload key (secret) e
# envia direto para o track `internal` da Play — o AAB assinado nunca vira
# artifact público. A promoção para `closed`/produção é manual no Console.
#
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON. Ver docs/PLAY-STORE.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: AAB assinado → Play (internal)
    runs-on: ubuntu-latest
    env:
      # `secrets` não pode ser usado em `if`; o env no job pode.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # O runner do ubuntu já traz o SDK; `android-actions/setup-android`
      # quebra ao tentar instalar o pacote `tools` com o cmdline-tools novo.
      - name: Android SDK + NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmgr="$(command -v sdkmanager || true)"
          if [ -z "$sdkmgr" ]; then
            sdkmgr="$(find "$ANDROID_HOME/cmdline-tools" /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$sdkmgr" ]; then
            echo "sdkmanager não encontrado no runner" >&2
            exit 1
          fi
          echo "sdkmanager: $sdkmgr"
          yes | "$sdkmgr" --licenses > /dev/null
          "$sdkmgr" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$GITHUB_REF_NAME' fora do padrão vX.Y.Z" >&2
            exit 1
          fi
          node tools/version.mjs check "$tag"
          echo "ANDROID_TAG_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Restaurar keystore de upload
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem ANDROID_KEYSTORE_BASE64: build sem assinatura." >&2
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/upload.jks" >> "$GITHUB_ENV"

      - name: Build do AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --aab --ci

      - name: Conferir o AAB
        run: |
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          if [ -z "$aab" ]; then
            echo "Nenhum AAB gerado" >&2
            exit 1
          fi
          echo "AAB: $aab ($(du -h "$aab" | cut -f1))"

      - name: Enviar para o track internal
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.reinaldoassis.atlas
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          track: internal
          status: completed
